# SwiftLint (https://github.com/realm/SwiftLint). `make lint` runs it in strict mode: every warning
# fails.
#
# Not enabled, on purpose:
# - no_magic_numbers: most literals in the code define a named constant or are layout values
#   (padding, spacing) SwiftUI takes as literals; the rule cannot allow them, so the house rule
#   stays a review rule.
included:
  - BRIQ-ios
  - BRIQ-macos
  - BRIQKit
  - BRIQTests
  - Shared
excluded:
  - BRIQ.xcodeproj
  - BRIQKit/.build
  - build
  # Written by briq-utils: a fix by hand would be undone by its next run.
  - BRIQKit/Sources/BRIQKit/Auto-Generated

opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

file_length:
  warning: 500
  error: 600
function_body_length:
  warning: 50
  error: 80
type_body_length:
  warning: 400
  error: 500
line_length:
  warning: 120
  error: 160
  ignores_urls: true
  # A line that is a string literal alone, or a labelled argument that is one
  # (`localized: "..."`), stays whole rather than being split and concatenated: a String Catalog
  # key is the whole sentence.
  excluded_lines_patterns:
    - '^\s*(\w+: )?"'
# SwiftFormat puts the brace of a wrapped condition or signature on its own line (its
# wrapMultilineStatementBraces rule); this rule must agree.
opening_brace:
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true
trailing_comma:
  mandatory_comma: true
# SwiftFormat's modifierOrder writes `private nonisolated static`, as the code already did; this
# rule's default wants the isolation first.
modifier_order:
  preferred_modifier_order:
    [override, acl, setterACL, final, dynamic, required, convenience, isolation, lazy, owned, typeMethods, mutators]
# The Core Data `create` factories take one argument per attribute (`Set.create` has eight
# without a default).
function_parameter_count:
  warning: 8
  error: 10
# `@Entry` takes the entry's default value from the initializer, so its `= nil` stays.
implicit_optional_initialization:
  ignore_attributes: [Entry]
identifier_name:
  min_length: 2
  excluded: [i, j, n, x, y, id, dx, dy, to, at, by]
